services:
  # Database
  mysql:
    image: mysql:8.0
    container_name: chat-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: chatapp
      MYSQL_USER: chatuser
      MYSQL_PASSWORD: chatpass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/migrations:/docker-entrypoint-initdb.d
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - chat-network

  # Cache
  redis:
    image: redis:7-alpine
    container_name: chat-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - chat-network

  # Backend API (Development with hot reload)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    container_name: chat-backend
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=chatuser
      - DB_PASSWORD=chatpass
      - DB_NAME=chatapp
      - REDIS_URL=redis:6379
      - PORT=8080
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - /app/tmp
    depends_on:
      - mysql
      - redis
    restart: unless-stopped
    networks:
      - chat-network

  # Frontend (to be implemented later)
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: chat-frontend
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     - backend
  #   environment:
  #     - REACT_APP_API_URL=http://localhost:8080
  #   networks:
  #     - chat-network

volumes:
  mysql_data:
  redis_data:

networks:
  chat-network:
    driver: bridge
